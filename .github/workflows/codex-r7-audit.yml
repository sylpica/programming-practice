name: Codex R7 independent native probes
on:
  push:
    branches: [codex-audit-r7-native]
permissions:
  contents: read
jobs:
  audit:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: VBA typed nested auxiliary VBScript matrix (not Excel)
        run: python audit-probes/final-r-vba-extra/native-vb.py
      - name: VBA typed fixed application
        run: node audit-probes/final-r-vba-extra/vba-app.mjs
      - name: R and VBA capped worst observed stress
        run: node audit-probes/final-r-vba-extra/stress.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codex-r7-final-r-vba-extra
          path: audit-probes/final-r-vba-extra/results*
