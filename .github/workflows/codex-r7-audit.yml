name: Codex R7 independent native probes
on:
  push:
    branches: [codex-audit-r7-native]
permissions:
  contents: read
jobs:
  audit:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Measure PAD and UI Vision model boundaries and path limits
        run: node audit-probes/step12/app.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codex-r7-native-evidence
          path: audit-probes/step12/results*.json
