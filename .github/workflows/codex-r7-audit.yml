name: Codex R7 independent native probes
on:
  push:
    branches: [codex-audit-r7-native]
permissions:
  contents: read
jobs:
  audit:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check all shell teaching examples and remaining automatic variables
        run: python audit-probes/step10/native.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codex-r7-native-evidence
          path: audit-probes/step10/results*.json
