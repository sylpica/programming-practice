name: Codex R7 independent native probes
on:
  push:
    branches: [codex-audit-r7-native]
permissions:
  contents: read
jobs:
  audit:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare PowerShell 7.4.6 portable runtime
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'pwsh-7.4.6.zip'
          $dir = Join-Path $env:RUNNER_TEMP 'pwsh-7.4.6'
          Invoke-WebRequest 'https://github.com/PowerShell/PowerShell/releases/download/v7.4.6/PowerShell-7.4.6-win-x64.zip' -OutFile $zip
          Expand-Archive $zip -DestinationPath $dir
          "PWSH_AUDIT_PATH=$dir\pwsh.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Execute independent cases
        run: python audit-probes/native.py
      - name: Check AHK and dotnet semantics
        run: python audit-probes/extra.py
      - uses: actions/upload-artifact@v4
        with:
          name: codex-r7-native-evidence
          path: audit-probes/results*.json
