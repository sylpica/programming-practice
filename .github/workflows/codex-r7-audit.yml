name: Codex R7 independent native probes
on:
  push:
    branches: [codex-audit-r7-native]
permissions:
  contents: read
jobs:
  audit:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.2.2'
          use-public-rspm: false
      - name: Final R boundary optional binding operator matrix
        run: python audit-probes/final-r-vba/run.py
      - name: VBA auxiliary Windows VBScript matrix (not Excel)
        run: python audit-probes/final-r-vba/native-vb.py
      - name: VBA fixed application Windows timing and results
        run: node audit-probes/final-r-vba/vba-app.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codex-r7-final-r-vba
          path: audit-probes/final-r-vba/results*
